# Render Blueprint: Dashboard → New → Blueprint → dieses Repo wählen
services:
  - type: web
    name: testas-sim
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /index.html
    # BETTER_AUTH_URL ist nicht nötig: es wird RENDER_EXTERNAL_URL verwendet (nur bei eigener Domain setzen)
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL           # Neon-Connection-String
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
