# Render Blueprint: Dashboard → New → Blueprint → dieses Repo wählen
services:
  - type: web
    name: testas-sim
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /index.html
    # BETTER_AUTH_URL ist nicht nötig: es wird RENDER_EXTERNAL_URL verwendet (nur bei eigener Domain setzen)
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL           # Neon-Connection-String
        sync: false
      - key: ADMIN_EMAILS           # Admin-E-Mail(s), kommagetrennt – a Render-Dashboardon kell megadni
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY          # Brevo → SMTP & API → API-Schlüssel (nur im Render-Dashboard eintragen, nie ins Repo)
        sync: false
      - key: MAIL_FROM              # in Brevo verifizierte Absenderadresse
        sync: false
      - key: MAIL_FROM_NAME
        value: Test-AS Simulation
